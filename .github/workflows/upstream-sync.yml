name: Sync and test upstream
permissions: {}
jobs:
  upstream:
    permissions:
      contents: write
      actions: write
      checks: read
    uses: dweee/dave-fork-ci/.github/workflows/upstream-sync.yml@a04b3a1df4290658ec41367a10faa058224314e9
    with:
      tool-repository: dweee/dave-fork-ci
      tool-revision: a04b3a1df4290658ec41367a10faa058224314e9
      auto-merge: ${{ vars.FORK_CI_AUTO_MERGE == 'true' && vars.ATTIC_PUSH_ENABLED == 'true' }}
      cache: false
      check-workflow: linux-actions.yml
    if: ${{ vars.GUARDED_UPSTREAM_SYNC_ENABLED == 'true' }}
'on':
  schedule:
    - cron: 17 */6 * * *
  workflow_dispatch: null
  repository_dispatch:
    types:
      - upstream-updated
