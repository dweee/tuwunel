name: Sync and test upstream
permissions: {}
jobs:
  upstream:
    permissions:
      contents: write
    uses: dweee/dave-fork-ci/.github/workflows/upstream-sync.yml@f506348a154600abbbc53025c39b14020b014e7d
    with:
      tool-repository: dweee/dave-fork-ci
      tool-revision: f506348a154600abbbc53025c39b14020b014e7d
      auto-merge: ${{ vars.FORK_CI_AUTO_MERGE == 'true' && vars.ATTIC_PUSH_ENABLED == 'true' }}
      cache: false
    if: ${{ vars.GUARDED_UPSTREAM_SYNC_ENABLED == 'true' }}
'on':
  schedule:
    - cron: 17 */6 * * *
  workflow_dispatch: null
  repository_dispatch:
    types:
      - upstream-updated
